name: Sync Wiz GitHub App Scope

on:
  schedule:
    # Daily run at midnight UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      # Runs immediately when security team merges a change to exclusions.yml
      - 'exclusions.yml'
  workflow_dispatch:

jobs:
  sync-wiz-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests pyyaml

      - name: Execute Scope Sync
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
          INSTALLATION_ID: ${{ secrets.WIZ_APP_INSTALLATION_ID }}
        run: |
          cat << 'EOF' > sync.py
          import os
          import sys
          import yaml
          import requests

          token = os.environ.get("GH_TOKEN")
          org = os.environ.get("ORG_NAME")
          installation_id = os.environ.get("INSTALLATION_ID")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          # 1. Read exclusions.yml
          try:
              with open("exclusions.yml", "r") as f:
                  data = yaml.safe_load(f) or {}
                  excluded_list = [
                      item["name"].strip().lower() 
                      for item in data.get("excluded_repositories", []) 
                      if "name" in item
                  ]
          except Exception as e:
              print(f"Failed to parse exclusions.yml: {e}")
              sys.exit(1)

          print(f"Loaded {len(excluded_list)} excluded repos from exclusions.yml")

          # 2. Fetch all org repos via pagination
          all_repos = []
          page = 1
          while True:
              url = f"https://api.github.com/orgs/{org}/repos?per_page=100&page={page}"
              res = requests.get(url, headers=headers)
              
              if res.status_code != 200:
                  print(f"Error fetching org repos: {res.status_code} - {res.text}")
                  sys.exit(1)
                  
              page_data = res.json()
              if not page_data:
                  break
                  
              all_repos.extend(page_data)
              page += 1

          print(f"Total organization repos: {len(all_repos)}")

          # 3. Fetch the repositories currently in the GitHub App installation scope
          sync_url = f"https://api.github.com/user/installations/{installation_id}/repositories"
          scoped_repos = []
          page = 1
          while True:
              url = f"{sync_url}?per_page=100&page={page}"
              res = requests.get(url, headers=headers)

              if res.status_code != 200:
                  print(f"Error fetching current app scope: {res.status_code} - {res.text}")
                  sys.exit(1)

              page_data = res.json().get("repositories", [])
              if not page_data:
                  break

              scoped_repos.extend(page_data)
              page += 1

          scoped_repo_ids = {repo["id"] for repo in scoped_repos}
          excluded_repo_ids = {
              repo["id"] for repo in all_repos
              if repo["name"].lower() in excluded_list
          }
          allowed_repos = [
              repo for repo in all_repos
              if repo["name"].lower() not in excluded_list
          ]
          repos_to_add = [
              repo for repo in allowed_repos
              if repo["id"] not in scoped_repo_ids
          ]
          repos_to_remove = [
              repo for repo in scoped_repos
              if repo["id"] in excluded_repo_ids
          ]

          print(f"Allowed organization repos: {len(allowed_repos)}")
          print(f"New repositories to add to Wiz scope: {len(repos_to_add)}")
          print(f"Excluded repositories to remove from Wiz scope: {len(repos_to_remove)}")

          # 4. Add newly created repositories and remove excluded repositories
          for repo in repos_to_add:
              repo_url = f"{sync_url}/{repo['id']}"
              put_res = requests.put(repo_url, headers=headers)

              if put_res.status_code != 204:
                  print(
                      f"Failed to add {repo['name']} to app scope: "
                      f"{put_res.status_code} - {put_res.text}"
                  )
                  sys.exit(1)

              print(f"Added {repo['name']} to Wiz scope")

          for repo in repos_to_remove:
              repo_url = f"{sync_url}/{repo['id']}"
              delete_res = requests.delete(repo_url, headers=headers)

              if delete_res.status_code != 204:
                  print(
                      f"Failed to remove {repo['name']} from app scope: "
                      f"{delete_res.status_code} - {delete_res.text}"
                  )
                  sys.exit(1)

              print(f"Removed excluded repository {repo['name']} from Wiz scope")

          print("Successfully synchronized Wiz GitHub App repository scope!")

          EOF

          python sync.py