name: Sync Wiz GitHub App Scope

on:
  schedule:
    # Daily run at midnight UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      # Runs immediately when security team merges a change to exclusions.yml
      - 'exclusions.yml'
  workflow_dispatch:

jobs:
  sync-wiz-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests pyyaml

      - name: Execute Scope Sync
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
          INSTALLATION_ID: ${{ secrets.WIZ_APP_INSTALLATION_ID }}
        run: |
          cat << 'EOF' > sync.py
          import os
          import sys
          import yaml
          import requests

          token = os.environ.get("GH_TOKEN")
          org = os.environ.get("ORG_NAME")
          installation_id = os.environ.get("INSTALLATION_ID")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          # 1. Read exclusions.yml
          try:
              with open("exclusions.yml", "r") as f:
                  data = yaml.safe_load(f) or {}
                  excluded_list = [
                      item["name"].strip().lower() 
                      for item in data.get("excluded_repositories", []) 
                      if "name" in item
                  ]
          except Exception as e:
              print(f"Failed to parse exclusions.yml: {e}")
              sys.exit(1)

          print(f"Loaded {len(excluded_list)} excluded repos from exclusions.yml")

          # 2. Fetch all org repos via pagination
          all_repos = []
          page = 1
          while True:
              url = f"https://api.github.com/orgs/{org}/repos?per_page=100&page={page}"
              res = requests.get(url, headers=headers)
              
              if res.status_code != 200:
                  print(f"Error fetching org repos: {res.status_code} - {res.text}")
                  sys.exit(1)
                  
              page_data = res.json()
              if not page_data:
                  break
                  
              all_repos.extend(page_data)
              page += 1
          print(f"Total organization repos: {len(all_repos)}")

          # 3. Build allowed and excluded repo ID lists
          allowed_repo_ids = {}
          excluded_repo_ids = {}

          for repo in all_repos:
              repo_name = repo["name"].lower()
              if repo_name in excluded_list:
                  excluded_repo_ids[repo["id"]] = repo["name"]
              else:
                  allowed_repo_ids[repo["id"]] = repo["name"]

          print(f"Allowed repos count: {len(allowed_repo_ids)}")
          print(f"Excluded repos count: {len(excluded_repo_ids)}")

          # 4. Fetch repos currently assigned to the GitHub App installation
          current_installed_ids = set()
          inst_page = 1
          while True:
              inst_url = f"https://api.github.com/user/installations/{installation_id}/repositories?per_page=100&page={inst_page}"
              inst_res = requests.get(inst_url, headers=headers)
              if inst_res.status_code != 200:
                  print(f"Error fetching current installation repos: {inst_res.status_code} - {inst_res.text}")
                  sys.exit(1)
              
              repos_data = inst_res.json().get("repositories", [])
              if not repos_data:
                  break
              for r in repos_data:
                  current_installed_ids.add(r["id"])
              inst_page += 1

          # 5. Remove newly excluded repos from the installation
          for repo_id, repo_name in excluded_repo_ids.items():
              if repo_id in current_installed_ids:
                  del_url = f"https://api.github.com/user/installations/{installation_id}/repositories/{repo_id}"
                  del_res = requests.delete(del_url, headers=headers)
                  if del_res.status_code == 204:
                      print(f"Removed excluded repo from scope: {repo_name} ({repo_id})")
                  else:
                      print(f"Failed to remove {repo_name}: {del_res.status_code} - {del_res.text}")
                      sys.exit(1)

          # 6. Add allowed repos that are missing from the installation
          for repo_id, repo_name in allowed_repo_ids.items():
              if repo_id not in current_installed_ids:
                  add_url = f"https://api.github.com/user/installations/{installation_id}/repositories/{repo_id}"
                  add_res = requests.put(add_url, headers=headers)
                  if add_res.status_code in [204, 304]:
                      print(f"Added allowed repo to scope: {repo_name} ({repo_id})")
                  else:
                      print(f"Failed to add {repo_name}: {add_res.status_code} - {add_res.text}")
                      sys.exit(1)

          print("Successfully synced Wiz GitHub App repository scope!")
          EOF
          python sync.py
