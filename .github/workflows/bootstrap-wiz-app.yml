name: ONE-TIME - Bootstrap Wiz App Scope

on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  bootstrap-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Convert App Scope and Seed Repositories
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
          INSTALLATION_ID: ${{ secrets.WIZ_APP_INSTALLATION_ID }}
        run: |
          cat << 'EOF' > bootstrap-scope.py
          import os
          import sys
          import requests

          token = os.environ.get("GH_TOKEN")
          org = os.environ.get("ORG_NAME")
          installation_id = os.environ.get("INSTALLATION_ID")

          if not all([token, org, installation_id]):
              print("Error: GH_TOKEN, ORG_NAME, and INSTALLATION_ID environment variables must be set.")
              sys.exit(1)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          all_repo_ids = []
          page = 1
          print(f"Gathering all repository IDs for organization: '{org}'...")

          while True:
              url = f"https://api.github.com/orgs/{org}/repos?per_page=100&page={page}"
              res = requests.get(url, headers=headers)
              
              if res.status_code != 200:
                  print(f"Error fetching org repos: {res.status_code} - {res.text}")
                  sys.exit(1)
                  
              page_data = res.json()
              if not page_data:
                  break
                  
              for repo in page_data:
                  all_repo_ids.append(repo["id"])
              page += 1

          print(f"Found {len(all_repo_ids)} repositories in the organization.")

          if not all_repo_ids:
              print("No repositories found to assign. Exiting.")
              sys.exit(0)

          print(f"Toggling GitHub App (Installation ID: {installation_id}) to selective mode and adding all repositories...")
          sync_url = f"https://api.github.com/orgs/{org}/installations/{installation_id}/repositories"
          payload = {
              "repository_selection": "selected",
              "repository_ids": all_repo_ids
          }

          put_res = requests.put(sync_url, headers=headers, json=payload)

          if put_res.status_code in [200, 204]:
              print("SUCCESS: GitHub App scope converted from 'All' to 'Selected' and successfully pre-seeded with all organization repositories!")
          else:
              print(f"FAILED to toggle App Installation scope: {put_res.status_code} - {put_res.text}")
              sys.exit(1)
          EOF
          python bootstrap-scope.py
